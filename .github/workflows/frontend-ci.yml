name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "DevKnow-frontend/**"
  pull_request:
    paths:
      - "DevKnow-frontend/**"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DevKnow-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: DevKnow-frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
