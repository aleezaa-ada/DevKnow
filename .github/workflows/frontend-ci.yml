name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "DevKnow-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "DevKnow-frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DevKnow-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: DevKnow-frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  cypress-e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devknow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devknow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: devknow_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DELOITTE_API_KEY: ci-test-key
      DELOITTE_BASE_URL: https://example.test
      DELOITTE_MODEL: gpt-4o

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: DevKnow-backend

      - name: Run backend migrations
        run: python manage.py migrate
        working-directory: DevKnow-backend

      - name: Start Django server
        run: python manage.py runserver 0.0.0.0:8000 &
        working-directory: DevKnow-backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: DevKnow-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: DevKnow-frontend

      - name: Start Vite dev server
        run: npm run dev &
        working-directory: DevKnow-frontend

      - name: Wait for servers to be ready
        run: |
          npx wait-on tcp:127.0.0.1:8000 --timeout 60000
          npx wait-on http://localhost:5173 --timeout 60000
        working-directory: DevKnow-frontend

      - name: Run Cypress E2E tests
        run: npm run e2e:run
        working-directory: DevKnow-frontend

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: DevKnow-frontend/cypress/screenshots
